<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b14">
    <title>My patterns — CodeReview AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <a class="brand" href="/static/index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 9-3 3 3 3M16 9l3 3-3 3M14 5l-4 14"/></svg></span><span>CodeReview AI</span></a>
            <nav class="nav-links"><a class="nav-link" href="/static/index.html">New review</a><a class="nav-link nav-link--accent active" href="/static/history.html">My patterns</a></nav>
        </header>
        <section class="page-heading"><span class="eyebrow"><span class="eyebrow-dot"></span> Your learning trail</span><h1>Recurring patterns</h1><p>Spot the habits that are worth a little extra attention.</p></section>
        <section class="section-card">
            <div class="section-header"><div><h2>Things to keep practicing</h2><p>Patterns are collected from your completed reviews.</p></div></div>
            <div id="patternsList" class="space-y-4"><div class="empty-state"><span class="loader"></span> Loading your patterns…</div></div>
        </section>
        <footer class="page-footer">Ready to put feedback into practice? <a class="text-link" href="/static/index.html">Start a new review →</a></footer>
    </main>
    <script>
        async function loadHistory() {
            const clientId = localStorage.getItem('clientId');
            if (!clientId) {
                document.getElementById('patternsList').innerHTML = '<p class="empty-state">No history yet. Complete a review and your patterns will appear here.</p>';
                return;
            }
            try {
                const response = await fetch('/history', { headers: { 'X-Client-ID': clientId } });
                if (response.ok) renderPatterns((await response.json()).patterns);
                else document.getElementById('patternsList').innerHTML = '<p class="empty-state">We couldn’t load your review history. Please try again.</p>';
            } catch (error) {
                document.getElementById('patternsList').innerHTML = '<p class="empty-state">We couldn’t load your review history. Please check your connection.</p>';
            }
        }
        function renderPatterns(patterns) {
            const container = document.getElementById('patternsList');
            if (!patterns.length) {
                container.innerHTML = '<p class="empty-state">No recurring patterns found yet — nice work. Keep reviewing to build your learning trail.</p>';
                return;
            }
            container.innerHTML = patterns.map(pattern => `
                <article class="pattern-card p-4">
                    <div class="flex justify-between items-center gap-4">
                        <div><h3 class="font-bold text-lg">${pattern.pattern_type}</h3><p class="text-gray-400 text-sm">${pattern.language} · Last seen ${new Date(pattern.last_seen).toLocaleString()}</p></div>
                        <div class="text-right"><div class="text-2xl font-bold" style="color:#fb7185">${pattern.occurrence_count}</div><div class="text-gray-400 text-sm">occurrences</div></div>
                    </div>
                </article>`).join('');
        }
        loadHistory();
    </script>
</body>
</html>
